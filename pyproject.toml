[project]
name = "search-r1-ecommerce-agent"
version = "0.1.0"
description = "Search-R1 reproduction (Qwen3.5-4B + GRPO via PyTRIO) extended with a Chinese e-commerce customer-service scenario: local Qdrant retrieval, citation-grounded rewards."
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "deepseek-search",
    "math-verify>=0.9.0",
    "matplotlib>=3.11.0",
    "modelscope>=1.38.1",
    "numpy>=2.5.1",
    "openai>=2.44.0",
    "python-dotenv>=1.2.2",
    "pytrio==0.2.9",
    "qdrant-client[fastembed]>=1.19.1",
    "swanlab==0.9.2",
    "tqdm>=4.68.3",
]

[tool.uv.sources]
# 本地只做数据与张量处理；训练和采样由远程 PyTRIO 服务执行。
deepseek-search = { git = "https://github.com/KMnO4-zx/deepseek-search.git", rev = "6215c8dbb7347f94e9dcea6e741df5918449d6c4" }
